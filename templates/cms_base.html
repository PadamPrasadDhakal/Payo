{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CMS - JobsHaru{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    <!-- CMS Header (No Navbar) -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-bold text-blue-600">JobsHaru CMS</h1>
                <span class="text-sm text-gray-600 font-semibold bg-yellow-100 px-3 py-1 rounded">Admin Panel</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-700">👤 {{ user.username }}</span>
                <a href="/admin/cms/logout/" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-sm font-semibold">
                    Logout
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-600">
            <p>&copy; 2025 JobsHaru CMS. All rights reserved.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
