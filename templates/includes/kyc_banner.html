{% if user.is_authenticated and user.needs_kyc_banner %}
<div class="bg-yellow-50 border-b-2 border-yellow-400 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <svg class="w-6 h-6 text-yellow-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      <div>
        <p class="text-sm font-semibold text-yellow-900">Complete Your KYC Verification</p>
        <p class="text-xs text-yellow-800">
          {% if user.is_applicant %}
            Limited to 2 job applications per day. Complete KYC to remove this limit.
          {% else %}
            Cannot post jobs until verified. Complete KYC now.
          {% endif %}
        </p>
      </div>
    </div>
    <div class="flex gap-2">
      <a href="/users/kyc/" class="px-4 py-2 rounded-lg bg-yellow-600 hover:bg-yellow-700 text-white font-medium text-sm transition">
        Complete KYC
      </a>
      <button onclick="this.parentElement.parentElement.parentElement.style.display='none'" class="text-yellow-800 hover:text-yellow-900 px-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
{% endif %}
