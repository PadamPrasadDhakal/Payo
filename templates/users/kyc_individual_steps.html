<!-- STEP 1: Personal Basic Info -->
<div id="step-1" class="kyc-step">
  <h3 class="text-xl font-semibold mb-6 text-blue-600">Step 1 — Personal Information</h3>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Full Name <span class="text-red-500">*</span></label>
      <input type="text" name="full_name" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Date of Birth <span class="text-red-500">*</span></label>
      <input type="date" name="date_of_birth" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Gender <span class="text-red-500">*</span></label>
      <select name="gender" required class="w-full border rounded px-3 py-2">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Nationality <span class="text-red-500">*</span></label>
      <input type="text" name="nationality" required value="Nepali" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Marital Status <span class="text-red-500">*</span></label>
      <select name="marital_status" required class="w-full border rounded px-3 py-2">
        <option value="">Select Status</option>
        <option value="Single">Single</option>
        <option value="Married">Married</option>
        <option value="Divorced">Divorced</option>
        <option value="Widowed">Widowed</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Occupation <span class="text-red-500">*</span></label>
      <input type="text" name="occupation" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Education Level <span class="text-red-500">*</span></label>
      <input type="text" name="education_level" required class="w-full border rounded px-3 py-2" placeholder="e.g., Bachelor's Degree" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Mobile Number <span class="text-red-500">*</span></label>
      <input type="tel" name="mobile_number" required pattern="[0-9]{10}" maxlength="10" class="w-full border rounded px-3 py-2" placeholder="98XXXXXXXX" />
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium mb-1">Email Address <span class="text-red-500">*</span></label>
      <input type="email" name="email_address" required class="w-full border rounded px-3 py-2" />
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium mb-1">Permanent Address <span class="text-red-500">*</span></label>
      <textarea name="permanent_address" required rows="2" class="w-full border rounded px-3 py-2" placeholder="Province → District → Municipality → Ward → Tole"></textarea>
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium mb-1">Temporary Address</label>
      <textarea name="temporary_address" rows="2" class="w-full border rounded px-3 py-2" placeholder="Leave blank if same as permanent"></textarea>
    </div>
  </div>
</div>

<!-- STEP 2: Identification & Documents -->
<div id="step-2" class="kyc-step hidden">
  <h3 class="text-xl font-semibold mb-6 text-blue-600">Step 2 — Identification & Documents</h3>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Citizenship Number <span class="text-red-500">*</span></label>
      <input type="text" name="citizenship_number" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Issue Date <span class="text-red-500">*</span></label>
      <input type="date" name="citizenship_issue_date" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Issue District <span class="text-red-500">*</span></label>
      <input type="text" name="citizenship_issue_district" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Passport Number (Optional)</label>
      <input type="text" name="passport_number" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Driving License Number (Optional)</label>
      <input type="text" name="driving_license_number" class="w-full border rounded px-3 py-2" />
    </div>
  </div>

  <div class="mt-6">
    <h4 class="font-semibold mb-4">Document Uploads (Max 5MB each, JPG/PNG)</h4>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Citizenship Front <span class="text-red-500">*</span></label>
        <input type="file" name="citizenship_front" required accept="image/jpeg,image/png" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Citizenship Back <span class="text-red-500">*</span></label>
        <input type="file" name="citizenship_back" required accept="image/jpeg,image/png" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Recent Passport-Size Photo <span class="text-red-500">*</span></label>
        <input type="file" name="recent_photo" required accept="image/jpeg,image/png" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Address Proof <span class="text-red-500">*</span></label>
        <input type="file" name="address_proof" required accept="image/jpeg,image/png,application/pdf" class="w-full border rounded px-3 py-2" />
        <p class="text-xs text-gray-500 mt-1">Citizenship/Rent Agreement/Utility Bill</p>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Passport Photo (Optional)</label>
        <input type="file" name="passport_photo" accept="image/jpeg,image/png" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Driving License (Optional)</label>
        <input type="file" name="driving_license" accept="image/jpeg,image/png" class="w-full border rounded px-3 py-2" />
      </div>
    </div>
  </div>
</div>

<!-- STEP 3: Additional Verification & Declarations -->
<div id="step-3" class="kyc-step hidden">
  <h3 class="text-xl font-semibold mb-6 text-blue-600">Step 3 — Additional Verification & Declarations</h3>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Father's Name <span class="text-red-500">*</span></label>
      <input type="text" name="father_name" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Mother's Name <span class="text-red-500">*</span></label>
      <input type="text" name="mother_name" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Grandfather's Name <span class="text-red-500">*</span></label>
      <input type="text" name="grandfather_name" required class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Spouse's Name (if married)</label>
      <input type="text" name="spouse_name" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Expected Monthly Transaction <span class="text-red-500">*</span></label>
      <select name="expected_monthly_transaction" required class="w-full border rounded px-3 py-2">
        <option value="">Select Range</option>
        <option value="Below 50,000">Below Rs. 50,000</option>
        <option value="50,000-200,000">Rs. 50,000 - 2,00,000</option>
        <option value="200,000-500,000">Rs. 2,00,000 - 5,00,000</option>
        <option value="Above 500,000">Above Rs. 5,00,000</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Annual Income Range <span class="text-red-500">*</span></label>
      <select name="annual_income_range" required class="w-full border rounded px-3 py-2">
        <option value="">Select Range</option>
        <option value="Below 500,000">Below Rs. 5,00,000</option>
        <option value="500,000-1,000,000">Rs. 5,00,000 - 10,00,000</option>
        <option value="1,000,000-2,000,000">Rs. 10,00,000 - 20,00,000</option>
        <option value="Above 2,000,000">Above Rs. 20,00,000</option>
      </select>
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium mb-1">Purpose of Account <span class="text-red-500">*</span></label>
      <input type="text" name="purpose_of_account" required value="Apply Jobs, CV Screening" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">User Signature (Optional)</label>
      <input type="file" name="user_signature" accept="image/jpeg,image/png" class="w-full border rounded px-3 py-2" />
    </div>
  </div>

  <div class="mt-6 space-y-3">
    <div class="flex items-start gap-2">
      <input type="checkbox" name="is_pep" id="is_pep" class="mt-1" />
      <label for="is_pep" class="text-sm">I am a Politically Exposed Person (PEP)</label>
    </div>
    <div class="flex items-start gap-2">
      <input type="checkbox" name="is_fatca" id="is_fatca" class="mt-1" />
      <label for="is_fatca" class="text-sm">I am subject to FATCA (Foreign Account Tax Compliance Act)</label>
    </div>
    <div class="flex items-start gap-2 p-4 bg-yellow-50 border border-yellow-200 rounded">
      <input type="checkbox" name="declaration" id="declaration" required class="mt-1" />
      <label for="declaration" class="text-sm font-medium">
        <span class="text-red-500">*</span> I confirm that all information provided is true and accurate. I understand that providing false information may result in rejection or legal action.
      </label>
    </div>
  </div>
</div>
