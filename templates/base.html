{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobsHaru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>    
      tailwind.config = { theme: { extend: { colors: { primary: '#6d28d9', secondary: '#22c55e' } } } }
    </script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body class="bg-gradient-to-br from-gray-50 to-white min-h-screen text-gray-800">
    <nav class="sticky top-0 z-50 bg-white/70 backdrop-blur shadow-sm">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                        <a href="/" class="flex items-center gap-2 text-xl font-extrabold tracking-tight text-primary hover:scale-105 transition-transform">
                            {% if user.is_authenticated and user.profile.logo %}
                                <img src="{{ user.profile.logo.url }}" alt="Logo" class="h-8 w-8 rounded-full border border-primary" />
                            {% endif %}
                            JobsHaru
                        </a>
                        <div class="hidden md:flex items-center gap-6">
                            <a class="hover:text-primary transition" href="/organization/jobs/">Jobs</a>
                            <a class="hover:text-secondary transition" href="/organization/dashboard/">Dashboard</a>
                            <a class="hover:text-secondary transition" href="/organization/jobs/new/">Post Job</a>
                </div>
                <div class="flex items-center gap-3">
                    
                    {% if user.is_authenticated %}
                        <!-- Notifications Bell -->
                        <button onclick="openNotificationsModal()" class="relative inline-flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 transition" title="Notifications">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span class="unread-count absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full hidden">0</span>
                        </button>

                        <a class="px-3 py-1.5 rounded-md bg-primary text-white hover:bg-purple-700 transition" href="/organization/profile/">Profile</a>
                        <a class="px-3 py-1.5 rounded-md border border-gray-300 hover:bg-gray-100 transition" href="/users/logout/">Logout</a>
                    {% else %}
                        <a class="px-3 py-1.5 rounded-md border border-gray-300 hover:bg-gray-100 transition" href="/users/login/">Login</a>
                        <a class="px-3 py-1.5 rounded-md bg-secondary text-white hover:bg-green-600 transition" href="/users/signup/">Signup</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    
    </main>
    <script src="{% static 'js/script.js' %}"></script>
    
    <!-- Notification Badge Update Script -->
    <script>
    {% if user.is_authenticated %}
    function updateNotificationBadge() {
      fetch('{% url "users:notification_count_api" %}')
        .then(response => response.json())
        .then(data => {
          const badge = document.querySelector('.unread-count');
          if (data.unread_count > 0) {
            badge.textContent = data.unread_count;
            badge.classList.remove('hidden');
          } else {
            badge.classList.add('hidden');
          }
        })
        .catch(err => console.log('Error fetching notification count:', err));
    }
    
    // Update badge on page load
    document.addEventListener('DOMContentLoaded', updateNotificationBadge);
    
    // Update badge every 30 seconds
    setInterval(updateNotificationBadge, 30000);
    
    // Update badge when user returns to the page
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        updateNotificationBadge();
      }
    });
    {% endif %}
    </script>
{% include "includes/footer.html" %}
</body>
</html>
